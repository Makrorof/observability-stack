global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Application metrics arrive via remote_write from Alloy (OTLP → Prometheus).
# Below we scrape the telemetry stack's own internal metrics.
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
